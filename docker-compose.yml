name: worldweave

services:
  worldweave:
    image: worldweave:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: ${WORLDWEAVE_STOP_GRACE_PERIOD:-45s}
    mem_limit: ${WORLDWEAVE_MEM_LIMIT:-2g}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PORT: "5000"
      HOST: 0.0.0.0
      WORLD_HOST: 0.0.0.0
      WORLD_WEB_ENABLE_HEAVY_REFRESH: "0"
      NODE_OPTIONS: ${WORLDWEAVE_NODE_OPTIONS:---max-old-space-size=1536}
    ports:
      - "${WORLDWEAVE_BIND_HOST:-127.0.0.1}:${WORLDWEAVE_HOST_PORT:-5000}:5000"
    volumes:
      - worldweave-cache:/app/.cache
    healthcheck:
      test: ["CMD", "node", "scripts/world-web-health.mjs"]
      interval: 10s
      timeout: 100s
      retries: 6
      start_period: 90s

  worldweave-refresh:
    image: worldweave:local
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: ${WORLDWEAVE_REFRESH_STOP_GRACE_PERIOD:-45s}
    mem_limit: ${WORLDWEAVE_REFRESH_MEM_LIMIT:-5g}
    env_file:
      - ${ENV_FILE:-.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_OPTIONS: ${WORLDWEAVE_REFRESH_NODE_OPTIONS:---max-old-space-size=4096}
      NODE_USE_ENV_PROXY: ${WORLDWEAVE_REFRESH_NODE_USE_ENV_PROXY:-0}
      HTTP_PROXY: ${WORLDWEAVE_REFRESH_HTTP_PROXY:-}
      HTTPS_PROXY: ${WORLDWEAVE_REFRESH_HTTPS_PROXY:-}
      NO_PROXY: ${WORLDWEAVE_REFRESH_NO_PROXY:-127.0.0.1,localhost}
      WORLD_SOURCE_REFRESH_INTERVAL_MINUTES: ${WORLD_SOURCE_REFRESH_INTERVAL_MINUTES:-60}
      WORLD_SOURCE_REFRESH_TIMEOUT_MINUTES: ${WORLD_SOURCE_REFRESH_TIMEOUT_MINUTES:-20}
      WORLD_SOURCE_REFRESH_MANAGE_WORKER: "1"
      WORLD_SOURCE_REFRESH_WORKER_PORT: "5020"
      WORLD_SOURCE_REFRESH_WORKER_HOST: 127.0.0.1
      WORLD_SOURCE_REFRESH_WORKER_READY_TIMEOUT_MS: ${WORLD_SOURCE_REFRESH_WORKER_READY_TIMEOUT_MS:-30000}
      WORLD_SOURCE_REFRESH_WORKER_READY_POLL_MS: ${WORLD_SOURCE_REFRESH_WORKER_READY_POLL_MS:-500}
      WORLD_SOURCE_REFRESH_STOP_GRACE_MS: ${WORLD_SOURCE_REFRESH_STOP_GRACE_MS:-30000}
      WORLD_SOURCE_REFRESH_ENDPOINT_CONCURRENCY: ${WORLD_SOURCE_REFRESH_ENDPOINT_CONCURRENCY:-3}
      WORLD_SOURCE_REFRESH_HEAVY_BATCH_SIZE: ${WORLD_SOURCE_REFRESH_HEAVY_BATCH_SIZE:-1}
      WORLD_SOURCE_REFRESH_WORKER_RESET_GRACE_MS: ${WORLD_SOURCE_REFRESH_WORKER_RESET_GRACE_MS:-25000}
      WORLD_SOURCE_REFRESH_WORKER_HEALTH_INTERVAL_MS: ${WORLD_SOURCE_REFRESH_WORKER_HEALTH_INTERVAL_MS:-15000}
      WORLD_SOURCE_REFRESH_WORKER_HEALTH_FAILURE_THRESHOLD: ${WORLD_SOURCE_REFRESH_WORKER_HEALTH_FAILURE_THRESHOLD:-2}
      WORLD_CATALOG_SOURCE_FETCH_CONCURRENCY: ${WORLD_CATALOG_SOURCE_FETCH_CONCURRENCY:-3}
      WORLD_CATALOG_SOURCE_REFRESH_BATCH_SIZE: ${WORLD_CATALOG_SOURCE_REFRESH_BATCH_SIZE:-40}
      WORLD_TRANSLATION_BATCH_SIZE: ${WORLD_TRANSLATION_BATCH_SIZE:-2}
      WORLD_TRANSLATION_PRIME_LIMIT: ${WORLD_TRANSLATION_PRIME_LIMIT:-8}
      WORLD_VISIBLE_TRANSLATION_BATCH_SIZE: ${WORLD_VISIBLE_TRANSLATION_BATCH_SIZE:-12}
      WORLD_ALIGNMENT_BATCH_SIZE: ${WORLD_ALIGNMENT_BATCH_SIZE:-2}
      WORLD_ALIGNMENT_PRIME_LIMIT: ${WORLD_ALIGNMENT_PRIME_LIMIT:-4}
      WORLD_SOURCE_KNOWLEDGE_SYNC_INTERVAL_MINUTES: ${WORLD_SOURCE_KNOWLEDGE_SYNC_INTERVAL_MINUTES:-30}
      WORLD_SOURCE_KNOWLEDGE_EMBED_BATCH_SIZE: ${WORLD_SOURCE_KNOWLEDGE_EMBED_BATCH_SIZE:-3}
      WORLD_SOURCE_KNOWLEDGE_EMBED_MAX_PENDING: ${WORLD_SOURCE_KNOWLEDGE_EMBED_MAX_PENDING:-60}
      WORLD_ASEAN_REFRESH_TIMEOUT_MS: ${WORLD_ASEAN_REFRESH_TIMEOUT_MS:-120000}
      WORLD_ASEAN_METASO_TIMEOUT_MS: ${WORLD_ASEAN_METASO_TIMEOUT_MS:-15000}
      WORLD_ASEAN_METASO_CONCURRENCY: ${WORLD_ASEAN_METASO_CONCURRENCY:-3}
      WORLD_ASEAN_SOURCE_FEED_TIMEOUT_MS: ${WORLD_ASEAN_SOURCE_FEED_TIMEOUT_MS:-15000}
      WORLD_ASEAN_SOURCE_FEED_CONCURRENCY: ${WORLD_ASEAN_SOURCE_FEED_CONCURRENCY:-4}
      WORLD_ASEAN_PUBLIC_RISK_TIMEOUT_MS: ${WORLD_ASEAN_PUBLIC_RISK_TIMEOUT_MS:-15000}
      WORLD_ASEAN_DATASET_METRIC_TIMEOUT_MS: ${WORLD_ASEAN_DATASET_METRIC_TIMEOUT_MS:-8000}
      WORLD_ASEAN_DATASET_FETCH_ATTEMPTS: ${WORLD_ASEAN_DATASET_FETCH_ATTEMPTS:-2}
      WORLD_ASEAN_DATASET_FETCH_CONCURRENCY: ${WORLD_ASEAN_DATASET_FETCH_CONCURRENCY:-4}
    command: ["node", "scripts/world-source-refresh-daemon.mjs"]
    volumes:
      - worldweave-cache:/app/.cache
    healthcheck:
      test: ["CMD", "node", "scripts/world-source-refresh-health.mjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  worldweave-cache:
    name: ${WORLDWEAVE_CACHE_VOLUME_NAME:-worldweave_worldweave-cache}
    external: ${WORLDWEAVE_CACHE_VOLUME_EXTERNAL:-false}
